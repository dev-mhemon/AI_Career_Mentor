      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Observed transitional success envelope; outside C05 catalog.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseDTOEnvelope'
        '401':
          description: AUTH_REQUIRED, INVALID_TOKEN, TOKEN_EXPIRED
          headers:
