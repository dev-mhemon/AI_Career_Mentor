  /account/deletion-requests:
    post:
      operationId: EP-X01
      tags:
        - Account
      summary: Request account deletion
      description: >-
        C05 EP-X01 (POST /api/v1/account/deletion-requests). Schedules and executes in-app account deletion with
        explicit literal 'DELETE' confirmation under AZ-SUSP (suspended users permitted alongside active users,
        requiring verified_contact = true and an approved session in private.approved_auth_sessions). M03-02 enforces
        live credential re-authentication (password against GoTrue / auth provider or OAuth reauth_token, failing with
        401 REAUTH_REQUIRED), confirmation === 'DELETE' (422 CONFIRMATION_MISMATCH per canonical contract), caller-scoped
        (userId + Idempotency-Key) process-local in-memory idempotency store with 24h TTL eviction, capacity bounding (reserveSlot
        on write), and concurrent in-flight deduplication (same key + same body returns cached 202 response; same key + different body
        returns 409 IDEMPOTENCY_KEY_REUSED). Note that because a completed deletion immediately revokes private.approved_auth_sessions
        and deletes public.users, post-completion HTTP replays to EP-X01 using the revoked Bearer JWT cannot succeed over HTTP (they
        are rejected with 401 at DeletionReceiptGuard before reaching the controller; EP-X02 with DeletionReceipt is the post-deletion
        status recovery path); the in-memory idempotency store and in-flight lock serve concurrent/in-flight deduplication and direct
        service-level callers during M03-02. Deletion executes inside an atomic database transaction executing local cascade deletion
        (DELETE FROM public.users triggering private.complete_deletion_on_user_delete to atomically transition public.account_deletion_requests
        to status = 'completed', completed_at = clock_timestamp(), and user_id = NULL per R05/R06), fail-closed session revocation in
        private.approved_auth_sessions and GoTrue auth.refresh_tokens / auth.sessions, and minting of a 24-hour HMAC-SHA256
        DeletionReceipt (R06). Encrypted provider_cleanup outbox worker retries (R35) and 90d/30d retention purge runners belong to M03-03.
