        '500':
          description: INTERNAL_ERROR, DATABASE_ERROR
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - INTERNAL_ERROR
            - DATABASE_ERROR
        '502':
          description: SMS_PROVIDER_ERROR, EMAIL_PROVIDER_ERROR, PROVIDER_ERROR
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
