components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT; ES256/issuer/audience/expiry/UUID validation in current backend.
    DeletionReceipt:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Request-scoped HMAC-SHA256 DeletionReceipt token passed as 'Authorization: DeletionReceipt <token>'
        on EP-X02 (C05 R06). Never passed in a URL. Bypasses only account-token/session lookup for EP-X02
        and looks up strictly the bound request_id (including completed null-owner tombstones).
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    Language:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - bn
          - en
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        H-IDEM idempotency key header (UUID, 24h TTL per C05 §13.1 / R14) for EP-X01. M03-02 implements a process-local,
        caller-scoped (userId + Idempotency-Key) in-memory idempotency store with TTL eviction and capacity capping (single-instance
        scope, does not survive process restarts). Same key + same body returns cached 202 response; same key + different body
        returns 409 IDEMPOTENCY_KEY_REUSED. Because a completed deletion immediately revokes private.approved_auth_sessions and
        deletes public.users, post-completion HTTP replays to EP-X01 using the revoked Bearer JWT cannot succeed over HTTP (they are
        rejected with 401 at DeletionReceiptGuard before reaching the controller; EP-X02 with DeletionReceipt is the post-deletion
        status recovery path); the in-memory idempotency store and in-flight lock serve concurrent/in-flight deduplication and
        direct service-level callers during M03-02. Active-request uniqueness is additionally enforced via PostgreSQL
        uq_account_deletion_one_active (409 DELETION_ALREADY_REQUESTED).
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: Included on every response. Matches error.requestId when an error is present.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Required on rate-limited 429 responses (C05 13.1); server retryAfterSeconds is authoritative.
      schema:
        type: integer
        minimum: 0
  schemas:
    RegisterRequestDTO:
      type: object
      required:
        - password
        - confirm_password
        - privacy_consent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: RFC email; lower-case normalization (C05 A01 / 15.2).
          nullable: true
        phone:
          type: string
          description: >-
            Bangladesh mobile input; normalized to +8801[3-9][0-9]{8}. Local 017... input is allowed by C05
            15.2; validation/normalization is semantic.
          nullable: true
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            C05 example/default minimum 8 is configurable; no all-numeric password. Server configured policy
            remains authoritative.
        confirm_password:
          type: string
          description: >-
            Must equal password. Mismatch: VALIDATION_FAILED with details field confirm_password / code
            PASSWORD_MISMATCH; nothing created.
        privacy_consent:
          type: boolean
          enum:
            - true
      description: >-
        Shared email/phone contract, not an email-only replacement. Exactly one non-null contact. Null unused
        contact follows C05 A01 example. Both omitted/null or two strings are invalid.
      oneOf:
        - required:
            - email
          properties:
            email:
              type: string
              format: email
              maxLength: 254
              description: RFC email; lower-case normalization (C05 A01 / 15.2).
        - required:
            - phone
          properties:
            phone:
              type: string
              description: >-
                Bangladesh mobile input; normalized to +8801[3-9][0-9]{8}. Local 017... input is allowed by
                C05 15.2; validation/normalization is semantic.
    RegistrationPendingDTO:
      type: object
      required:
        - verification_channel
        - contact_masked
        - expires_in_seconds
        - resend_available_at
      properties:
        verification_channel:
          type: string
          enum:
            - email
            - phone
        contact_masked:
          type: string
        expires_in_seconds:
          type: integer
          description: >-
            Provider challenge validity remaining; R31 proposed operating policy is 600 seconds, not a
            hard-coded example response.
        resend_available_at:
          type: string
          format: date-time
    VerifyCodeRequestDTO:
      type: object
      required:
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: RFC email; lower-case normalization (C05 A01 / 15.2).
        phone:
          type: string
          description: >-
            Bangladesh mobile input; normalized to +8801[3-9][0-9]{8}. Local 017... input is allowed by C05
            15.2; validation/normalization is semantic.
        code:
          type: string
          pattern: ^\d{6}$
      description: >-
        Shared DTO: email required on verify-email; phone required on verify-phone. Only verify-email
        operation is included in this increment.
      oneOf:
        - required:
            - email
        - required:
            - phone
    EmailVerificationRequest:
      allOf:
        - $ref: '#/components/schemas/VerifyCodeRequestDTO'
        - type: object
          required:
            - email
      description: >-
        C05 A02 email form of shared VerifyCodeRequestDTO. Added-contact mode supplies JWT; signup mode is
        public.
    VerifyPhoneRequestDTO:
      allOf:
        - $ref: '#/components/schemas/VerifyCodeRequestDTO'
        - type: object
          required:
            - phone
      description: >-
        C05 EP-A03 phone form of shared VerifyCodeRequestDTO. Requires normalized Bangladesh mobile number
        and six-digit challenge code.
    ResendVerificationDTO:
      type: object
      required:
        - channel
        - contact
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        contact:
          type: string
          description: 'Must match channel: RFC email or Bangladesh phone, normalized as C05 A01.'
    LoginRequestDTO:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email or Bangladesh phone; normalize using C05 A01 rules.
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshTokenDTO:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    OAuthSessionRequestDTO:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - google
            - facebook
    ForgotPasswordRequestDTO:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string
          description: Registered Bangladesh mobile number or email address; normalized using C05 A01 rules.
    ForgotPasswordResponseDTO:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'If the account exists, a code was sent.'
    ResetPasswordRequestDTO:
      type: object
      required:
        - identifier
        - code
        - new_password
        - confirm_new_password
      properties:
        identifier:
          type: string
          description: Registered Bangladesh mobile number or email address; normalized using C05 A01 rules.
        code:
          type: string
          pattern: ^\d{6}$
          description: Six-digit verification challenge code.
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: New password meeting length and non-numeric complexity policy.
        confirm_new_password:
          type: string
          description: 'Must match new_password exactly; mismatch emits VALIDATION_FAILED with field-detail code PASSWORD_MISMATCH.'
    ResetPasswordResponseDTO:
      type: object
      required:
        - password_reset
      properties:
        password_reset:
          type: boolean
          enum:
            - true
    LinkIdentityRequestDTO:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - google
            - facebook
    LinkIdentityResponseDTO:
      type: object
      required:
        - linked_providers
      properties:
        linked_providers:
          type: array
          items:
            type: string
          description: Authentication providers linked to the authenticated user account.
          example:
