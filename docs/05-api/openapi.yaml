openapi: 3.0.3
info:
  title: AI Career Mentor - Authentication, Account Deletion, Profile, Career Goals, Durable Jobs, AI Gateway, Roadmaps, Learning, Quizzes, Practice Review & Progress Contract (M08)
  version: 0.4.0
  description: >-
    Synchronized through M08-01, 2026-11-23. Derived from adopted C05 v1.5.1. Source baseline:
    f7fdb182201450779860406ede33f723c62c00fb. Canonical auth operations (EP-A01..EP-A13), account deletion and
    retention/outbox workers (EP-X01/EP-X02, R05/R06/R08/R09/R35), user profile and skill alias resolution
    (EP-P01..EP-P05, R07, R29, ADR-019), dynamic career goals and synchronous AI goal interpretation
    (EP-C01..EP-C07, R07, R29), durable asynchronous job polling (EP-J01 GET /api/v1/jobs/{id}), Redis 24h H-IDEM
    Replay Controls with R14 Loss-Epoch Fail-Closed Barrier (IdempotencyService), durable Postgres FOR UPDATE SKIP
    LOCKED job producer/consumer/reaper (R12, R13, ADR-017), internal-only AI Gateway contracts (ADR-008, C08),
    M06 Roadmap Lifecycle & Async Worker APIs (EP-R01..EP-R07, EP-R14, EP-R15), M07 Learning APIs (EP-L01..EP-L07),
    and M08 Quiz, AI Practice Review, and Progress APIs (EP-Q01..EP-Q07, EP-PR01..EP-PR03, EP-G01..EP-G03; note that
    EP-G04 EvidenceService.record is strictly internal-only with no HTTP route) are documented here.
servers:
  - url: /api/v1
tags:
  - name: Email and session
    description: C05 14.1 subset; shared DTOs preserve later phone/OAuth requirements.
  - name: Account
    description: C05 14.2 Account API (EP-X01, EP-X02); account deletion request scheduling, DeletionReceipt authority, and status lookup.
  - name: Profile
    description: C05 14.3 Profile API (EP-P01..EP-P05); background, existing skills / explicit beginner None (R07), learning preferences, timezone/hours, and user-scoped skill alias interpretation (ADR-019).
  - name: Career Goals
    description: C05 14.4 Career Goal API (EP-C01..EP-C07); free-text technology career goal submission, synchronous AI goal interpretation, up to 2 clarification rounds, canonical role & career level confirmation (R07, R29), and goal discontinuation with roadmap archival.
  - name: Jobs
    description: C05 14.13 Jobs API (EP-J01 GET /api/v1/jobs/{id}); authenticated owner job status polling (Gate none).
  - name: Roadmaps
    description: C05 14.5 Roadmaps API (EP-R01..EP-R07, EP-R14, EP-R15); roadmap draft generation/revision async jobs, review/lock, immutable version snapshots, focus switching, and archiving.
  - name: Learning
    description: C05 14.6 Daily Plan, Today & Shared Topic Content APIs (EP-L01..EP-L07).
  - name: Quizzes
    description: C05 14.7 Practice Quiz API (EP-Q01..EP-Q07); deterministic MCQ grading, autosave, sequential day unlock on submission, and single retry cap.
  - name: Practice Review
    description: C05 14.8 AI Practice Review API (EP-PR01..EP-PR03); asynchronous free-response rubric evaluation, feedback retrieval, and 90-day retention retry enforcement.
  - name: Progress
    description: C05 14.9 Level-Scoped Progress API (EP-G01..EP-G03); EP-G04 EvidenceService.record is strictly internal-only with no HTTP route.
x-source: API-Specification.md sections 13, 13.5-6, 14.1-9, 14.13, 15.1-9, 15.12, 16, 17.1, 17.3-5 and accepted R05/R06/R07/R08/R12/R13/R14/R17/R18/R24/R26/R28/R29/R31/R35
x-contract-notes:
  - >-
    H-PUB has no Authorization; H-AUTH uses Bearer Supabase JWT; H-IDEM supplies Idempotency-Key (UUID, 24h TTL)
    on idempotent mutation routes such as EP-X01; EP-X02 accepts either Bearer JWT or 'Authorization:
    DeletionReceipt <token>' (C05 R06). Content-Type application/json for bodies; optional X-Request-Id UUID.
    Every response has X-Request-Id; every 429 includes Retry-After.
  - >-
    R31: auth:v1 HMAC contact/IP components; six digits/600s provider challenge, five failures/one consume;
    resend60s,3/contact/15min,10/IP/15min; login5/identifier+IP/15min with15min lockout. Redis send/verify
    outage => retryable SERVICE_UNAVAILABLE503. Limits are operating defaults, not new product requirements.
  - >-
    C05 common errors apply in addition to endpoint-specific codes. PLATFORM/provider/DB failures retain
    section16 meanings; no raw provider diagnostics. Error code/status lists follow scoped endpoint plus
    common policy.
  - >-
    Auth operations (EP-A01–EP-A13) do not use Idempotency-Key, challenge_id, or identifier URL parameters;
    EP-X01 documents H-IDEM (Idempotency-Key header).
  - x-* annotations are documentation metadata, not wire fields or implementation enums.
  - >-
    Registration exactly-one/non-null choice uses overlapping oneOf branches so both actual strings fail. RFC
    email, BD normalization, matching password and channel/contact validation require semantic validation
    beyond OpenAPI.
  - >-
    Transitional sync uses observed nullable retry metadata. Canonical A10/A13 source has the same formatter
    discrepancy, explicitly recorded in x-observed-gaps.
paths:
  /auth/register:
    post:
      operationId: EP-A01
      tags:
        - Email and session
      summary: Register by email or Bangladesh phone
      description: >-
        C05 EP-A01. Implemented for email and Bangladesh phone registration (TextBeeSmsProvider) with Option 2B GoTrue Admin
        pending identity creation, atomic unverified public.users/public.user_auth_providers persistence, and S1 Redis
        HMAC-SHA256 OTP challenge dispatch. Delivers SMS via TextBee REST API when configured, falls back to Mailpit in
        non-production, or fails closed with retryable 503 SERVICE_UNAVAILABLE when unconfigured. No session is issued until verification.
      x-source: API-Specification.md sections 13, 14.1, 15.1-2, 16, 17.1; accepted R18/R24/R31
      x-implementation-status: implemented
      x-authorization-profile: AZ-PUB
      security: []
