openapi: 3.0.3
info:
  title: AI Career Mentor - Authentication, Password Recovery, Phone, Account Deletion & Atomic Cascade Contract (M03-02)
  version: 0.1.0
  description: >-
    Synchronized through M03-02, 2026-11-10. Derived from adopted C05 v1.5.1. Source baseline:
    ed6bf9f2296fe7c34873f893298df8f5ed3236f0. Canonical auth operations including email registration (EP-A01),
    email and phone verification (EP-A02/EP-A03), verification resend (EP-A04), login (EP-A05), logout (EP-A06),
    token refresh (EP-A07), password recovery (EP-A08/EP-A09), OAuth bootstrap (EP-A10), social linking (EP-A11),
    add contact (EP-A12), me (EP-A13), and account deletion re-authentication, atomic cascade execution, session
    revocation, and DeletionReceipt authority / tombstone status query (EP-X01/EP-X02) are implemented (with phone
    SMS delivery failing closed with 503 SERVICE_UNAVAILABLE while the SMS provider adapter is disabled, and encrypted
    provider_cleanup outbox retries and 90d/30d retention purge runners belonging to M03-03). See M03-02 task record,
    backend architecture, DTO-DB-mapping and QA-plan.
servers:
  - url: /api/v1
tags:
  - name: Email and session
    description: C05 14.1 subset; shared DTOs preserve later phone/OAuth requirements.
  - name: Account
    description: C05 14.2 Account API (EP-X01, EP-X02); account deletion request scheduling, DeletionReceipt authority, and status lookup.
x-source: API-Specification.md sections 13, 14.1, 14.2, 15.1-2, 16, 17.1 and accepted R05/R06/R14/R18/R24/R31/R35
x-contract-notes:
  - >-
    H-PUB has no Authorization; H-AUTH uses Bearer Supabase JWT; H-IDEM supplies Idempotency-Key (UUID, 24h TTL)
    on idempotent mutation routes such as EP-X01; EP-X02 accepts either Bearer JWT or 'Authorization:
    DeletionReceipt <token>' (C05 R06). Content-Type application/json for bodies; optional X-Request-Id UUID.
    Every response has X-Request-Id; every 429 includes Retry-After.
  - >-
    R31: auth:v1 HMAC contact/IP components; six digits/600s provider challenge, five failures/one consume;
    resend60s,3/contact/15min,10/IP/15min; login5/identifier+IP/15min with15min lockout. Redis send/verify
    outage => retryable SERVICE_UNAVAILABLE503. Limits are operating defaults, not new product requirements.
  - >-
    C05 common errors apply in addition to endpoint-specific codes. PLATFORM/provider/DB failures retain
    section16 meanings; no raw provider diagnostics. Error code/status lists follow scoped endpoint plus
    common policy.
  - >-
    Auth operations (EP-A01–EP-A13) do not use Idempotency-Key, challenge_id, or identifier URL parameters;
    EP-X01 documents H-IDEM (Idempotency-Key header).
  - x-* annotations are documentation metadata, not wire fields or implementation enums.
  - >-
    Registration exactly-one/non-null choice uses overlapping oneOf branches so both actual strings fail. RFC
    email, BD normalization, matching password and channel/contact validation require semantic validation
    beyond OpenAPI.
  - >-
    Transitional sync uses observed nullable retry metadata. Canonical A10/A13 source has the same formatter
    discrepancy, explicitly recorded in x-observed-gaps.
paths:
  /auth/register:
    post:
      operationId: EP-A01
      tags:
        - Email and session
      summary: Register by email or Bangladesh phone
      description: >-
        C05 EP-A01. Implemented for email registration with Option 2B GoTrue Admin pending identity creation,
        atomic unverified public.users/public.user_auth_providers persistence, and S1 Redis HMAC-SHA256 OTP
        challenge dispatch. Phone registration shares the contract and fails closed with retryable 503
        SERVICE_UNAVAILABLE while the SMS provider adapter is disabled. No session is issued until verification.
      x-source: API-Specification.md sections 13, 14.1, 15.1-2, 16, 17.1; accepted R18/R24/R31
      x-implementation-status: implemented
      x-authorization-profile: AZ-PUB
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDTO'
      responses:
        '201':
          description: C05 EP-A01 success; success envelope.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPendingDTOEnvelope'
        '400':
          description: INVALID_FORMAT
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - INVALID_FORMAT
        '409':
          description: CONTACT_ALREADY_REGISTERED
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - CONTACT_ALREADY_REGISTERED
        '422':
          description: VALIDATION_FAILED, INVALID_ENUM_VALUE, INVALID_PHONE_NUMBER, PASSWORD_POLICY_FAILED
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - VALIDATION_FAILED
            - INVALID_ENUM_VALUE
            - INVALID_PHONE_NUMBER
