openapi: 3.0.3
info:
  title: AI Career Mentor - M01-01 email/session contract increment
  version: 0.1.0
  description: >-
    Draft / review pending, 2026-10-24. Derived from adopted C05 v1.5.1. SPECIFIED is not IMPLEMENTED or
    ACCEPTED. Source inspection: 5a71a5b8196a619ae0960b212fe71e74d79e0fb6. Six planned canonical operations
    plus existing A10/A13 and observed sync; no phone verification/recovery/link/deletion or internal HTTP
    routes invented. See M01-01 task record, backend architecture, DTO-DB-mapping and QA-plan. OpenAPI
    describes wire contracts; semantic rules and provider capability gaps remain linked review obligations.
servers:
  - url: /api/v1
tags:
  - name: Email and session
    description: C05 14.1 subset; shared DTOs preserve later phone/OAuth requirements.
x-source: API-Specification.md sections 13, 14.1, 15.1-2, 16, 17.1 and accepted R18/R24/R31
x-contract-notes:
  - >-
    H-PUB has no Authorization; H-AUTH uses Bearer Supabase JWT. Content-Type application/json for bodies;
    optional X-Request-Id UUID. Every response has X-Request-Id; every 429 includes Retry-After.
  - >-
    R31: auth:v1 HMAC contact/IP components; six digits/600s provider challenge, five failures/one consume;
    resend60s,3/contact/15min,10/IP/15min; login5/identifier+IP/15min with15min lockout. Redis send/verify
    outage => retryable SERVICE_UNAVAILABLE503. Limits are operating defaults, not new product requirements.
  - >-
    C05 common errors apply in addition to endpoint-specific codes. PLATFORM/provider/DB failures retain
    section16 meanings; no raw provider diagnostics. Error code/status lists follow scoped endpoint plus
    common policy.
  - >-
    No request Idempotency-Key, challenge_id, identifier URL parameter, new status or email-only next_step
    variant is introduced.
  - x-* annotations are documentation metadata, not wire fields or implementation enums.
  - >-
    Registration exactly-one/non-null choice uses overlapping oneOf branches so both actual strings fail. RFC
    email, BD normalization, matching password and channel/contact validation require semantic validation
    beyond OpenAPI.
  - >-
    Transitional sync uses observed nullable retry metadata. Canonical A10/A13 source has the same formatter
    discrepancy, explicitly recorded in x-observed-gaps.
