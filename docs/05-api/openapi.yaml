    AccountDeletionRequestDTO:
      type: object
      additionalProperties: false
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          enum:
            - DELETE
          description: Exact literal 'DELETE' required to confirm account deletion.
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Account password for password-authenticated accounts (live credential re-authentication verification
            is enforced in M03-02).
        reauth_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Short-lived re-authentication token for OAuth-only accounts (live OAuth re-authentication verification
            is enforced in M03-02).
      not:
        required:
          - password
          - reauth_token
    AccountDeletionStatusDTO:
      type: object
      required:
        - id
        - status
        - requested_at
        - completed_at
        - provider_deletion_requested
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the public.account_deletion_requests row.
        status:
          type: string
          enum:
            - scheduled
            - in_progress
            - completed
          description: Deletion workflow state; 'completed' indicates local user cascade deletion committed (R05).
        requested_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the deletion request was created.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp when local deletion completed, or null while scheduled/in_progress.
        provider_deletion_requested:
          type: boolean
          description: True only when all applicable external provider deletion requests were accepted (R35).
        deletion_receipt:
          type: string
          description: >-
            HMAC-SHA256 signed request-scoped receipt (claims: typ='deletion_receipt', request_id,
            aud='account-deletion-status', iat, exp; C05 R06). Returned on EP-X01 202 responses.
        receipt_expires_at:
          type: string
          format: date-time
          description: ISO-8601 expiration timestamp for deletion_receipt (24h from issue per R06).
