      operationId: EP-Q07_retryQuizAttempt
      summary: EP-Q07 Retry Topic Quiz Once (C05 §14.7, implemented M08-01)
      description: >
        Creates or enqueues attempt #2 (variant_no=2) after attempt #1 submission while retaining
        attempt #1 evidence. Enforces max 1 retry per plan item (409 RETRY_LIMIT_REACHED). Requires
        H-IDEM and Gate: write (quiz_practice).
