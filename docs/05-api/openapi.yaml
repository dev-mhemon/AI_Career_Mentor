      summary: Observed compatibility bootstrap
      description: >-
        Outside C05 catalog, retained only to explain current email/phone/OAuth frontend handoff. No body is
        consumed. JWT bootstrap skips app guard; live Auth lookup and UUID comparison precede mapping. Creates
        profile/preferences and stamps login/activity, so unsuitable for silent refresh.
        x-authorization-profile is descriptive of observed suspended bootstrap access, not a newly adopted
        operation.
      x-source: ../../backend/src/auth/controllers/auth.controller.ts; ../02-architecture/backend-architecture.md
      x-implementation-status: transitional-implemented
      x-authorization-profile: AZ-SUSP
      security:
