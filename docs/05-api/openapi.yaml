components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued JWT; ES256/issuer/audience/expiry/UUID validation in current backend.
    DeletionReceipt:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Request-scoped HMAC-SHA256 DeletionReceipt token passed as 'Authorization: DeletionReceipt <token>'
        on EP-X02 (C05 R06). Never passed in a URL. Bypasses only account-token/session lookup for EP-X02
        and looks up strictly the bound request_id (including completed null-owner tombstones).
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    Language:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - bn
          - en
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        H-IDEM idempotency key header (UUID, 24h default TTL IDEMPOTENCY_TTL_SECONDS per C05 §13.1 / R14) for
        idempotent mutation routes (EP-X01 and async job mutations). Implemented by Redis-backed IdempotencyService
        (M04-01) with atomic Lua epoch/PTTL checks, R14 Loss-Epoch Fail-Closed Barrier (503 SERVICE_UNAVAILABLE on
        outage or unacknowledged epoch), canonical body-hash comparison (409 IDEMPOTENCY_KEY_REUSED on mismatch or
        PostgreSQL uq_ai_requests_idempotency 23505), and reservation-deadline enforcement.
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Mandatory H-IDEM idempotency key header (UUID) enforced on EP-R01, EP-R04, EP-R05, and EP-L02 by IdempotencyService.
      schema:
        type: string
        format: uuid
    IfMatchVersion:
      name: If-Match
      in: header
      required: false
      description: >-
        Optional optimistic concurrency version header accepting positive integer version strings (e.g. "1" or
        W/"1") on EP-R04 and EP-R05.
      schema:
        type: string
  headers:
    RequestId:
      description: Included on every response. Matches error.requestId when an error is present.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Required on rate-limited 429 responses (C05 13.1); server retryAfterSeconds is authoritative.
      schema:
        type: integer
        minimum: 0
  schemas:
    RegisterRequestDTO:
      type: object
      required:
        - password
        - confirm_password
        - privacy_consent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: RFC email; lower-case normalization (C05 A01 / 15.2).
          nullable: true
        phone:
          type: string
          description: >-
            Bangladesh mobile input; normalized to +8801[3-9][0-9]{8}. Local 017... input is allowed by C05
            15.2; validation/normalization is semantic.
          nullable: true
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            C05 example/default minimum 8 is configurable; no all-numeric password. Server configured policy
            remains authoritative.
        confirm_password:
          type: string
          description: >-
            Must equal password. Mismatch: VALIDATION_FAILED with details field confirm_password / code
            PASSWORD_MISMATCH; nothing created.
        privacy_consent:
          type: boolean
          enum:
            - true
      description: >-
        Shared email/phone contract, not an email-only replacement. Exactly one non-null contact. Null unused
        contact follows C05 A01 example. Both omitted/null or two strings are invalid.
      oneOf:
        - required:
            - email
          properties:
            email:
              type: string
              format: email
              maxLength: 254
              description: RFC email; lower-case normalization (C05 A01 / 15.2).
        - required:
            - phone
          properties:
            phone:
              type: string
              description: >-
                Bangladesh mobile input; normalized to +8801[3-9][0-9]{8}. Local 017... input is allowed by
                C05 15.2; validation/normalization is semantic.
    RegistrationPendingDTO:
      type: object
      required:
        - verification_channel
        - contact_masked
        - expires_in_seconds
        - resend_available_at
      properties:
        verification_channel:
          type: string
          enum:
            - email
            - phone
        contact_masked:
          type: string
        expires_in_seconds:
          type: integer
          description: >-
            Provider challenge validity remaining; R31 proposed operating policy is 600 seconds, not a
            hard-coded example response.
        resend_available_at:
          type: string
          format: date-time
    VerifyCodeRequestDTO:
      type: object
      required:
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: RFC email; lower-case normalization (C05 A01 / 15.2).
        phone:
          type: string
          description: >-
            Bangladesh mobile input; normalized to +8801[3-9][0-9]{8}. Local 017... input is allowed by C05
            15.2; validation/normalization is semantic.
        code:
          type: string
          pattern: ^\d{6}$
      description: >-
        Shared DTO: email required on verify-email; phone required on verify-phone. Only verify-email
        operation is included in this increment.
      oneOf:
        - required:
            - email
        - required:
            - phone
    EmailVerificationRequest:
      allOf:
        - $ref: '#/components/schemas/VerifyCodeRequestDTO'
        - type: object
          required:
            - email
      description: >-
        C05 A02 email form of shared VerifyCodeRequestDTO. Added-contact mode supplies JWT; signup mode is
        public.
    VerifyPhoneRequestDTO:
      allOf:
        - $ref: '#/components/schemas/VerifyCodeRequestDTO'
        - type: object
          required:
            - phone
      description: >-
        C05 EP-A03 phone form of shared VerifyCodeRequestDTO. Requires normalized Bangladesh mobile number
        and six-digit challenge code.
    ResendVerificationDTO:
      type: object
      required:
        - channel
        - contact
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        contact:
          type: string
          description: 'Must match channel: RFC email or Bangladesh phone, normalized as C05 A01.'
    LoginRequestDTO:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email or Bangladesh phone; normalize using C05 A01 rules.
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshTokenDTO:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    OAuthSessionRequestDTO:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - google
            - facebook
    ForgotPasswordRequestDTO:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string
          description: Registered Bangladesh mobile number or email address; normalized using C05 A01 rules.
    ForgotPasswordResponseDTO:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'If the account exists, a code was sent.'
    ResetPasswordRequestDTO:
      type: object
      required:
        - identifier
        - code
        - new_password
        - confirm_new_password
      properties:
        identifier:
          type: string
          description: Registered Bangladesh mobile number or email address; normalized using C05 A01 rules.
        code:
          type: string
          pattern: ^\d{6}$
          description: Six-digit verification challenge code.
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: New password meeting length and non-numeric complexity policy.
        confirm_new_password:
          type: string
          description: 'Must match new_password exactly; mismatch emits VALIDATION_FAILED with field-detail code PASSWORD_MISMATCH.'
    ResetPasswordResponseDTO:
      type: object
      required:
        - password_reset
      properties:
        password_reset:
          type: boolean
          enum:
            - true
    LinkIdentityRequestDTO:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum:
            - google
            - facebook
    LinkIdentityResponseDTO:
      type: object
      required:
        - linked_providers
      properties:
        linked_providers:
          type: array
          items:
            type: string
          description: Authentication providers linked to the authenticated user account.
          example:
            - phone
            - google
    AddContactRequestDTO:
      type: object
      required:
        - channel
        - contact
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        contact:
          type: string
          description: Email address or Bangladesh mobile number to link and verify.
    AuthUserDTO:
      type: object
      required:
        - id
        - email
        - phone
        - status
        - role
        - linked_providers
        - verified_contact
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - suspended
        role:
          type: string
          enum:
            - USER
            - ADMIN
        linked_providers:
          type: array
          items:
            type: string
        verified_contact:
          type: boolean
    AuthSessionDTO:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - token_type
        - user
        - profile_complete
        - next_step
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          enum:
            - Bearer
        user:
          $ref: '#/components/schemas/AuthUserDTO'
        profile_complete:
          type: boolean
        next_step:
          type: string
