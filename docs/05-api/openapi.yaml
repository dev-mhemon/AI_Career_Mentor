              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseDTOEnvelope'
        '401':
          description: AUTH_REQUIRED, INVALID_TOKEN, TOKEN_EXPIRED
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - AUTH_REQUIRED
            - INVALID_TOKEN
            - TOKEN_EXPIRED
        '429':
          description: RATE_LIMITED
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - RATE_LIMITED
        '500':
          description: INTERNAL_ERROR
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - INTERNAL_ERROR
        '503':
          description: SERVICE_UNAVAILABLE
          headers:
