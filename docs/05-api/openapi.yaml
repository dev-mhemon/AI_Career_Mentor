  /auth/logout:
    post:
      operationId: EP-A06
      tags:
        - Email and session
      summary: Revoke current session
      description: >-
        C05 EP-A06. Implemented. Revokes the current session in private.approved_auth_sessions and performs best-effort
        upstream GoTrue local-scope logout; contract requires idempotent logout with a valid JWT while missing/invalid/expired
        tokens return 401. Current implementation gap: while AuthService.logout is idempotent at the service layer,
        an HTTP client retry with a valid JWT after session revocation as well as a first-time logout from an unverified
        account (e.g. unverified OAuth) currently receives 403 UNVERIFIED_ACCOUNT from AccessGuard because AuthController.logout
        does not exempt unverified contacts (tracked as open under Q09).
      x-source: API-Specification.md sections 13, 14.1, 15.1-2, 16, 17.1; accepted R18/R24/R31
      x-implementation-status: implemented
      x-authorization-profile: AZ-SUSP
      security:
        - SupabaseBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: C05 EP-A06 success; success envelope.
          headers:
            X-Request-Id:
