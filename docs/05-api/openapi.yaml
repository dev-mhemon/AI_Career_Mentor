          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created attempt #2 from approved shared variant_no=2 quiz (QuizAttemptDTO envelope).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptDTOEnvelope'
        '202':
          description: Async variant_no=2 quiz_generate job queued or reused (JobAcceptedDTO envelope).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedDTOEnvelope'
        '400':
          description: INVALID_FORMAT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FEATURE_DISABLED, ACCOUNT_SUSPENDED, or VERIFIED_CONTACT_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: RESOURCE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: QUIZ_NOT_SUBMITTED, RETRY_LIMIT_REACHED, PLAN_ITEM_NOT_AVAILABLE, or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: SERVICE_UNAVAILABLE (R14 idempotency store unavailable or reservation expired)
