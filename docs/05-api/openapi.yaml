              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          x-error-codes:
            - SERVICE_UNAVAILABLE
      x-observed-gaps:
        - >-
          Shared HTTP formatter emits null retryAfterSeconds; normative ErrorDTO allows optional nonnegative
          integer.
  /auth/sync:
    post:
      operationId: transitionalSync
      tags:
