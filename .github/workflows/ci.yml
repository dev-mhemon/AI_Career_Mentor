name: CI Pipeline

on:
  push:
    branches: [ main, develop, phase1-restart, "chore/repository-alignment*" ]
  pull_request:
    branches: [ main, develop, phase1-restart ]

permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/alignment/verify.py
      - run: python3 scripts/foundation/verify-baseline.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      auth-redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Test shared Auth controls against disposable Redis
        run: npm run test:redis
        env:
          AUTH_ABUSE_TEST_REDIS_URL: redis://127.0.0.1:6379
          AUTH_ABUSE_TEST_DISPOSABLE: 'yes'
